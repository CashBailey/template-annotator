[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "template-annotator"
version = "1.1.0"
description = "Draw and name template regions (rectangles, circles, chamfer rects) on images or PDFs and export them as JSON/CSV."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Cash Bailey" }]
keywords = ["pyqt6", "annotation", "pdf", "template", "ocr", "regions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.5",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/CashBailey/areaDef"
Source = "https://github.com/CashBailey/areaDef"
Issues = "https://github.com/CashBailey/areaDef/issues"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23"]
# QR / AprilTag / barcode detection (ensemble; each backend optional at runtime).
# pyzbar additionally needs the system library libzbar0.
markers = ["opencv-contrib-python>=4.8", "pyzbar>=0.1.9", "pupil-apriltags>=1.0.4"]
test = ["pytest>=7.4", "pytest-qt>=4.2", "pytest-xdist>=3.5", "pytest-timeout>=2.2", "ruff>=0.6"]

[project.scripts]
# Launches the GUI when called with no subcommand. There is deliberately no
# gui-scripts (pythonw) twin: it pointed at the same entry point, and under
# pythonw every CLI subcommand -- and every status message -- would print into
# a console that does not exist.
template-annotator = "areaDef:main"

[tool.setuptools]
py-modules = ["areaDef"]

[tool.ruff.lint]
# This ruff version's built-in default enables a much larger rule surface
# (pyupgrade, bandit, isort, pylint subsets, etc: ~360 hits on this codebase,
# almost all style preference, not bugs). Pin to ruff's long-standing
# conservative default (E4/E7/E9/F) instead: pyflakes catches real bugs
# (undefined names, unused imports, shadowed imports) with near-zero noise,
# which is what a "seconds-fast" CI lint gate needs.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
# Per-test wall-clock ceiling. A hung Qt event loop or a wedged CLI subprocess
# fails the test instead of stalling the run (and CI's job timeout) -- so no
# lane has to pass --timeout of its own.
timeout = 180
markers = [
    "e2e: end-to-end tests",
    "gui: GUI interaction tests",
    "visual: visual regression tests",
]
