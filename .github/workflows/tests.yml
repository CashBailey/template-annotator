name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  unit:
    name: unit (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libfontconfig1

      - name: Install package
        run: pip install -e .[pdf,markers,test]

      # Fixture byte-identity is a same-toolchain contract (PDF/PNG bytes vary
      # with the installed PyMuPDF/Pillow), so `gen_fixtures.py --check` runs
      # locally, not here — CI installs unpinned latest and would flag drift
      # that no repo change caused.

      - name: Run fast test lane
        run: pytest -m "not e2e and not gui and not visual" -n auto

  e2e:
    name: e2e (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Install package
        run: pip install -e .[pdf,markers,test]

      - name: Run e2e lane (serial)
        run: pytest tests/e2e -ra

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-py${{ matrix.python-version }}
          path: ${{ env.E2E_ARTIFACT_DIR }}
          if-no-files-found: ignore
